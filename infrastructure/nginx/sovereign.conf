# Reverse proxy for the Sovereign AI Workbench — serves the built frontend and
# proxies /api to the Node backend. Air-gapping note: this server itself must not
# have a default route to the internet; deny-by-default is enforced by the
# application's egress guard for node processes.

server {
    listen 80;
    server_name sovereign.local;

    root /var/www/sovereign;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Hardening: consume a real TLS termination proxy upstream before the edge
    # is allowed to talk to the backend in production. Enable any strong TLS
    # (>=1.2) certificate here — do NOT serve this over plain HTTP outside an
    # isolated lab network.

    # Security headers (hardening).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Request hardening: drop oversized bodies fast, cap request size.
    client_max_body_size 25m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Built frontend (frontend/dist)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + workbench API.
    # NOTE: backend listens on 5000 by default; adjust the proxy if PORT changes.
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 120s;
    }
}